schema_version: ods.services.v1

compatibility:
  ods_min: "2.0.0"

service:
  id: vllm
  name: vLLM (High-Concurrency Inference)
  aliases: [vllm-server]
  container_name: ods-vllm
  default_host: vllm
  # Internal container port (vLLM's OpenAI server). External host port is
  # VLLM_PORT (default 8001) so it never collides with llama-server (8000).
  port: 8000
  external_port_env: VLLM_PORT
  external_port_default: 8001
  # vLLM's OpenAI server exposes /health (200 once weights are loaded and CUDA
  # graphs are warmed; it 503s during the ~90-120s warm-up window).
  health: /health
  health_timeout: 15
  type: docker
  # CUDA-first. vLLM has no Metal backend and its ROCm path lags NVIDIA, so this
  # ships NVIDIA-only by design (see docs/VLLM-SETUP.md hardware-fit table).
  gpu_backends: [nvidia]
  # Opt-in: only compose.yaml.disabled is shipped, so the registry/compose
  # resolver does not auto-start vLLM. Enabling it (rename to compose.yaml)
  # runs vLLM ALONGSIDE llama-server, not as a replacement.
  compose_file: compose.yaml
  category: optional
  depends_on: []
